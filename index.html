<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="pageTitle">Digital Card Template</title>
  <meta name="description" content="Современный шаблон страницы-визитки с настраиваемыми соцсетями, темами и иконками.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>

  <main class="template-shell">
    <section class="brand-column">
      <img id="logoImage" class="brand-logo" src="logoweb.png" alt="Логотип">
      <p id="brandTagline" class="brand-tagline"></p>
      <h1 id="brandName" class="brand-name"></h1>
      <p id="brandDescription" class="brand-description"></p>

      <div id="infoChips" class="chip-list"></div>
      <div id="primaryActions" class="action-list"></div>
    </section>

    <section class="links-column">
      <header class="links-head">
        <p id="socialCaption" class="social-caption"></p>
        <h2 id="socialTitle" class="social-title"></h2>
        <p id="socialDescription" class="social-description"></p>
      </header>

      <div id="socialLinks" class="social-grid"></div>
      <div id="themeSwitcher" class="theme-switcher"></div>
      <p id="footerNote" class="footer-note"></p>
    </section>
  </main>

  <script src="assets/js/template-config.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
